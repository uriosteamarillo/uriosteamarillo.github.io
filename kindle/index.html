```html
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <title>My Kindle Notes</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #000000;
            margin: 20px;
            max-width: 700px;
        }

        h1 {
            font-size: 26px;
            border-bottom: 2px solid #000000;
            padding-bottom: 10px;
        }

        h2 {
            font-size: 20px;
        }

        input, textarea {
            width: 100%;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            font-size: 18px;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #777777;
        }

        textarea {
            height: 180px;
        }

        button {
            font-size: 18px;
            padding: 10px 16px;
            margin: 5px 5px 10px 0;
            background: #eeeeee;
            color: #000000;
            border: 1px solid #555555;
        }

        .note {
            border-top: 1px solid #999999;
            padding: 12px 0;
        }

        .note-title {
            font-size: 20px;
            font-weight: bold;
        }

        .note-date {
            font-size: 13px;
            color: #555555;
            margin: 5px 0;
        }

        .note-content {
            font-size: 17px;
            white-space: pre-wrap;
            margin: 8px 0;
        }

        #status {
            font-size: 15px;
            margin: 10px 0;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

<h1>My Kindle Notes</h1>

<div id="status">Loading...</div>

<button onclick="showNewNote()">+ New Note</button>

<div id="editor" class="hidden">

    <h2>New Note</h2>

    <input
        type="text"
        id="title"
        placeholder="Title">

    <textarea
        id="content"
        placeholder="Write your note..."></textarea>

    <button onclick="saveNote()">SAVE</button>
    <button onclick="cancelNote()">CANCEL</button>

</div>

<h2>Notes</h2>

<div id="notes">
</div>

<script>

var API_URL =
    "https://gz2tmb3zh5rqxlftcdisr2igjy0tjosd.lambda-url.us-west-2.on.aws/";


function setStatus(message) {
    document.getElementById("status").innerHTML = message;
}


function loadNotes() {

    setStatus("Loading notes...");

    var xhr = new XMLHttpRequest();

    xhr.open("GET", API_URL, true);

    xhr.onreadystatechange = function() {

        if (xhr.readyState !== 4) {
            return;
        }

        if (xhr.status === 200) {

            try {

                var notes = JSON.parse(xhr.responseText);

                displayNotes(notes);

                setStatus(notes.length + " note(s)");

            } catch (e) {

                setStatus("Error reading notes");

            }

        } else {

            setStatus(
                "Error: HTTP " + xhr.status
            );

        }
    };

    xhr.onerror = function() {

        setStatus("Connection error");

    };

    xhr.send();
}


function displayNotes(notes) {

    var container =
        document.getElementById("notes");

    container.innerHTML = "";

    if (notes.length === 0) {

        container.innerHTML =
            "<p>No notes yet.</p>";

        return;
    }

    /*
     * Newest notes first
     */

    notes.sort(function(a, b) {

        return String(b.createdAt)
            .localeCompare(String(a.createdAt));

    });


    for (var i = 0; i < notes.length; i++) {

        var note = notes[i];

        var div =
            document.createElement("div");

        div.className = "note";


        var title =
            document.createElement("div");

        title.className = "note-title";

        title.innerHTML =
            escapeHtml(note.title);


        var date =
            document.createElement("div");

        date.className = "note-date";

        date.innerHTML =
            escapeHtml(note.createdAt || "");


        var content =
            document.createElement("div");

        content.className = "note-content";

        content.innerHTML =
            escapeHtml(note.content);


        var deleteButton =
            document.createElement("button");

        deleteButton.innerHTML = "DELETE";


        deleteButton.onclick =
            (function(id) {

                return function() {

                    deleteNote(id);

                };

            })(note.id);


        div.appendChild(title);
        div.appendChild(date);
        div.appendChild(content);
        div.appendChild(deleteButton);

        container.appendChild(div);
    }
}


function showNewNote() {

    document.getElementById("editor")
        .className = "";

    document.getElementById("title")
        .value = "";

    document.getElementById("content")
        .value = "";

    document.getElementById("title")
        .focus();
}


function cancelNote() {

    document.getElementById("editor")
        .className = "hidden";
}


function saveNote() {

    var title =
        document.getElementById("title").value;

    var content =
        document.getElementById("content").value;


    if (!title && !content) {

        alert("Please enter a note.");

        return;
    }


    setStatus("Saving...");


    var xhr = new XMLHttpRequest();

    xhr.open("POST", API_URL, true);

    xhr.setRequestHeader(
        "Content-Type",
        "application/json"
    );


    xhr.onreadystatechange = function() {

        if (xhr.readyState !== 4) {
            return;
        }

        if (xhr.status === 200 ||
            xhr.status === 201) {

            cancelNote();

            loadNotes();

        } else {

            setStatus(
                "Error saving: HTTP " +
                xhr.status
            );

        }
    };


    xhr.onerror = function() {

        setStatus("Connection error");

    };


    var data = {

        title: title,

        content: content

    };


    xhr.send(
        JSON.stringify(data)
    );
}


function deleteNote(id) {

    if (!confirm("Delete this note?")) {
        return;
    }


    setStatus("Deleting...");


    var xhr = new XMLHttpRequest();

    xhr.open(
        "DELETE",
        API_URL + "?id=" +
        encodeURIComponent(id),
        true
    );


    xhr.onreadystatechange = function() {

        if (xhr.readyState !== 4) {
            return;
        }

        if (xhr.status === 200) {

            loadNotes();

        } else {

            setStatus(
                "Error deleting: HTTP " +
                xhr.status
            );

        }
    };


    xhr.onerror = function() {

        setStatus("Connection error");

    };


    xhr.send();
}


function escapeHtml(text) {

    if (text === null ||
        text === undefined) {

        return "";

    }

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


loadNotes();

</script>

</body>
</html>
