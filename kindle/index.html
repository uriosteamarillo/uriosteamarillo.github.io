</div>

<h2>Notes</h2>

<div id="notes"></div>

<script>

var API =
    "https://gz2tmb3zh5rqxlftcdisr2igjy0tjosd.lambda-url.us-west-2.on.aws/";


/* ============================
   STATUS
============================ */

function setStatus(message, type) {

    var element =
        document.getElementById("status");

    element.className = type || "";

    element.innerHTML = message;
}


/* ============================
   LOAD NOTES
============================ */

function loadNotes() {

    setStatus("Loading notes...", "");

    var xhr =
        new XMLHttpRequest();

    xhr.open(
        "GET",
        API + "?action=list",
        true
    );

    xhr.onload = function() {

        console.log(
            "LIST STATUS:",
            xhr.status
        );

        console.log(
            "LIST RESPONSE:",
            xhr.responseText
        );

        if (xhr.status !== 200) {

            setStatus(
                "Error reading notes: HTTP " +
                xhr.status +
                "<br>" +
                xhr.responseText,
                "error"
            );

            return;
        }

        try {

            var data =
                JSON.parse(
                    xhr.responseText
                );

            if (!data.success) {

                setStatus(
                    "API error: " +
                    data.error,
                    "error"
                );

                return;
            }

            renderNotes(
                data.items
            );

            setStatus(
                data.items.length +
                " note(s)",
                "success"
            );

        } catch (error) {

            setStatus(
                "Invalid API response:<br>" +
                xhr.responseText,
                "error"
            );
        }
    };


    xhr.onerror = function() {

        setStatus(
            "Connection error while reading notes.",
            "error"
        );
    };


    xhr.send();
}


/* ============================
   DISPLAY NOTES
============================ */

function renderNotes(items) {

    var container =
        document.getElementById("notes");

    container.innerHTML = "";


    if (!items || items.length === 0) {

        container.innerHTML =
            "<p>No notes yet.</p>";

        return;
    }


    for (
        var i = 0;
        i < items.length;
        i++
    ) {

        var note =
            items[i];

        var div =
            document.createElement("div");

        div.className =
            "note";


        var title =
            document.createElement("div");

        title.className =
            "note-title";

        title.textContent =
            note.title || "(No title)";


        var date =
            document.createElement("div");

        date.className =
            "note-date";

        date.textContent =
            note.createdAt || "";


        var content =
            document.createElement("div");

        content.className =
            "note-content";

        content.textContent =
            note.content || "";


        var deleteButton =
            document.createElement("button");

        deleteButton.textContent =
            "DELETE";

        deleteButton.onclick =
            (function(id) {

                return function() {
                    deleteNote(id);
                };

            })(note.id);


        div.appendChild(title);
        div.appendChild(date);
        div.appendChild(content);
        div.appendChild(deleteButton);

        container.appendChild(div);
    }
}


/* ============================
   NEW NOTE
============================ */

function showEditor() {

    document.getElementById(
        "editor"
    ).style.display = "block";

    document.getElementById(
        "title"
    ).value = "";

    document.getElementById(
        "content"
    ).value = "";

    document.getElementById(
        "title"
    ).focus();
}


function cancelNote() {

    document.getElementById(
        "editor"
    ).style.display = "none";
}


/* ============================
   SAVE NOTE
============================ */

function saveNote() {

    var title =
        document.getElementById(
            "title"
        ).value;

    var content =
        document.getElementById(
            "content"
        ).value;


    if (
        title.trim() === "" &&
        content.trim() === ""
    ) {

        setStatus(
            "Write something first.",
            "error"
        );

        return;
    }


    setStatus(
        "Saving...",
        ""
    );


    var url =
        API +
        "?action=save" +
        "&title=" +
        encodeURIComponent(title) +
        "&content=" +
        encodeURIComponent(content);


    console.log(
        "SAVE URL:",
        url
    );


    var xhr =
        new XMLHttpRequest();


    xhr.open(
        "GET",
        url,
        true
    );


    xhr.onload = function() {

        console.log(
            "SAVE STATUS:",
            xhr.status
        );

        console.log(
            "SAVE RESPONSE:",
            xhr.responseText
        );


        if (xhr.status !== 200) {

            setStatus(
                "Save error: HTTP " +
                xhr.status +
                "<br>" +
                xhr.responseText,
                "error"
            );

            return;
        }


        try {

            var data =
                JSON.parse(
                    xhr.responseText
                );


            if (!data.success) {

                setStatus(
                    "Save error: " +
                    data.error,
                    "error"
                );

                return;
            }


            document.getElementById(
                "editor"
            ).style.display = "none";


            setStatus(
                "Note saved.",
                "success"
            );


            loadNotes();

        } catch (error) {

            setStatus(
                "Invalid save response:<br>" +
                xhr.responseText,
                "error"
            );
        }
    };


    xhr.onerror = function() {

        setStatus(
            "Connection error while saving.",
            "error"
        );
    };


    xhr.send();
}


/* ============================
   DELETE
============================ */

function deleteNote(id) {

    if (
        !confirm(
            "Delete this note?"
        )
    ) {
        return;
    }


    setStatus(
        "Deleting...",
        ""
    );


    var xhr =
        new XMLHttpRequest();


    xhr.open(
        "GET",
        API +
        "?action=delete&id=" +
        encodeURIComponent(id),
        true
    );


    xhr.onload = function() {

        console.log(
            "DELETE STATUS:",
            xhr.status
        );

        console.log(
            "DELETE RESPONSE:",
            xhr.responseText
        );


        if (xhr.status !== 200) {

            setStatus(
                "Delete error: HTTP " +
                xhr.status +
                "<br>" +
                xhr.responseText,
                "error"
            );

            return;
        }


        try {

            var data =
                JSON.parse(
                    xhr.responseText
                );


            if (!data.success) {

                setStatus(
                    "Delete error: " +
                    data.error,
                    "error"
                );

                return;
            }


            setStatus(
                "Note deleted.",
                "success"
            );


            loadNotes();

        } catch (error) {

            setStatus(
                "Invalid delete response:<br>" +
                xhr.responseText,
                "error"
            );
        }
    };


    xhr.onerror = function() {

        setStatus(
            "Connection error while deleting.",
            "error"
        );
    };


    xhr.send();
}


/* ============================
   START
============================ */

loadNotes();

</script>

</body>
</html>
